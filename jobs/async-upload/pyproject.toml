[tool.poetry]
name = "async-upload"
version = "0.0.1"
description = "Model Registry Job to upload a Model from a source to a destination"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "job"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
configargparse = ">=1.7.1,<2.0.0"
model-registry = { version = ">=0.3.7,<0.4.0", extras = ["boto3", "olot", "signing"] }
botocore = ">=1.43.117"
certifi = ">=2026.10.18"
# CVE-2026-69247: PKCS#7 decryption must not expose an RSA padding oracle.
cryptography = ">=50.0.0,<51.0.0"
# Sigstore 4.4+ permits cryptography 50; 4.5.1 switches to the excluded uv_build backend.
sigstore = ">=4.4.0,<4.5.1"
pydantic = ">=2.0.0,<3.0.0"
# hf-xet (Rust) is a mandatory dep from huggingface-hub 0.31+;
# it breaks hermetic Cachi2 prefetch (cargo vendor on stale Cargo.lock).
huggingface-hub = ">=0.29.3,<0.31.0"
requests = "^2.33.0"
# protobuf 7.34.0's native upb extension segfaults on s390x during signing imports.
# Keep this pin in Poetry so exporting requirements cannot restore that version.
protobuf = "7.35.0"
pyasn1 = ">=0.6.5"
pyjwt = ">=2.14.0"
# dnspython 2.9+ requires uv_build, which is excluded from hermetic builds.
dnspython = ">=2.8.0,<2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.5,<10.0.0"
pytest-asyncio = "^1.3.0"
aiohttp = "^3.13.4"

[tool.poetry.group.integration.dependencies]
kubernetes = "^33.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "e2e: marks tests as end-to-end tests",
    "integration: marks tests as integration tests"
]


[tool.ruff]
line-length = 119
